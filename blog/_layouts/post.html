---
layout: default
---
<article>
  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span>{{ page.date | date: "%d %b %Y" }}</span>
      {% if page.read_time %} · <span>{{ page.read_time }} min read</span>{% endif %}
    </div>
    {% if page.tags %}
    <div style="margin-top: 10px;">
      {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
      {% endfor %}
    </div>
    {% endif %}
  </div>

  <div class="post-content">
    {{ content }}
  </div>

  <a href="{{ '/' | relative_url }}" class="back-link">back to all posts</a>
</article>
